<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mélység</title>
<meta name="description" content="Fúrókapszulával a Föld középpontja felé: kéreg, köpeny, mag – és ami a közepén vár.">
<style>
:root{--bg:#0b0907;--panel:#17120e;--line:#3a2c20;--ink:#f3e7d6;--dim:#a8957f;--lava:#ff7a2a;--gold:#f2c14e;--cool:#59c3ff;--ok:#7bd88f;--bad:#ff5a4f;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--m:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;pointer-events:none;font:600 12px var(--m);text-shadow:0 1px 3px #000}
.hud .big{font:800 26px var(--m);letter-spacing:-.5px}
.hud .col{display:flex;flex-direction:column;gap:2px}
.bars{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;pointer-events:none;font:600 11px var(--m)}
.bar{height:7px;border-radius:4px;background:#ffffff1c;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;border-radius:4px}
.fel{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 58px);pointer-events:auto;background:#0009;color:var(--ink);border:1px solid #fff4;border-radius:10px;padding:8px 12px;font:700 13px var(--f)}
.uz{position:fixed;left:50%;top:30%;transform:translateX(-50%);max-width:min(92vw,520px);text-align:center;font:600 14px/1.4 var(--f);background:#000b;border:1px solid #fff2;border-radius:12px;padding:10px 14px;pointer-events:none;transition:opacity .4s}
.lap{position:fixed;inset:0;overflow-y:auto;background:radial-gradient(120% 70% at 50% 0%,#2a1a10 0%,var(--bg) 60%);padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 30px)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:900 44px/1 var(--f);letter-spacing:-1.5px;margin:6px 0 0;background:linear-gradient(180deg,#ffd9a8,#ff7a2a 60%,#a3260f);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font:800 19px var(--f);margin:0 0 6px}h3{font:700 15px var(--f);margin:0}
p{margin:6px 0}.dim{color:var(--dim)}.kicsi{font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{font:700 12px var(--m);padding:3px 8px;border-radius:9px;border:1px solid var(--line);color:var(--gold);white-space:nowrap}
button{font:inherit;cursor:pointer}
.go{width:100%;padding:16px;border:0;border-radius:14px;font:900 20px var(--f);letter-spacing:.5px;color:#1b0d03;background:linear-gradient(180deg,#ffb15c,#ff6a1f);box-shadow:0 6px 24px #ff6a1f55}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}.up:first-of-type{border-top:0}
.up button{grid-row:span 2;align-self:center;padding:9px 12px;border-radius:10px;border:1px solid var(--lava);background:#ff7a2a18;color:var(--ink);font-weight:800;min-width:96px}
.up button:disabled{opacity:.4;border-color:var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{flex:1;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--dim);font-weight:700;font-size:13px}
.tabs button[aria-pressed=true]{color:var(--ink);border-color:var(--lava);background:#ff7a2a14}
.log{display:flex;flex-direction:column;gap:8px}.log div{border-left:2px solid var(--lava);padding-left:10px}
.vtab{width:100%;border-collapse:collapse;font-size:13px}.vtab td,.vtab th{padding:5px 3px;border-bottom:1px solid var(--line);text-align:left}.vtab th{color:var(--dim)}.vtab tr.en td{color:var(--gold);font-weight:700}.vtab td.sz{text-align:right}
.fent{font-size:11px;padding:1px 6px;border-radius:8px;background:#7bd88f22;color:var(--ok);margin-left:4px}
input{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#0d0a08;color:var(--ink)}
a.kapu{display:inline-block;margin:6px 8px 0 0;padding:8px 12px;border-radius:10px;border:1px solid #9b7bff;color:#cbb9ff;text-decoration:none;font-weight:700}
#fold{width:100%;height:auto;display:block;margin:4px auto}
.osszeg{font:600 14px var(--m)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud" hidden>
  <div class="col"><span class="dim">MÉLYSÉG</span><span class="big" id="hD">0 km</span><span id="hR">Felső kéreg</span></div>
  <div class="col" style="text-align:right"><span><span class="dim">KÜLSŐ</span> <b id="hT">15 °C</b></span><span><span class="dim">NYOMÁS</span> <b id="hP">0 GPa</b></span><span><span class="dim">g</span> <b id="hG">9,8</b> m/s²</span><span><span class="dim">MINTA</span> <b id="hK">0</b> kr</span></div>
</div>
<div class="bars" id="bars" hidden>
  <div>ENERGIA <span id="bEt"></span><div class="bar"><i id="bE" style="background:var(--cool)"></i></div></div>
  <div>BELSŐ HŐ <span id="bHt"></span><div class="bar"><i id="bH" style="background:var(--lava)"></i></div></div>
</div>
<button class="fel" id="fel" hidden>⤒ Felszínre</button>
<div class="uz" id="uz" style="opacity:0"></div>
<div class="lap" id="lap"><div class="wrap" id="wrap"></div></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;
const hu=(n,d=0)=>n.toLocaleString('hu-HU',{minimumFractionDigits:d,maximumFractionDigits:d});
const km=d=>d<10?hu(d,2)+' km':d<100?hu(d,1)+' km':hu(Math.round(d))+' km';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- A Föld belseje (PREM-modell közelítése): mélység km → hőmérséklet, nyomás, nehézségi gyorsulás ----
const R0=6371;
const TPROF=[[0,15],[12,180],[35,600],[100,1300],[410,1450],[660,1600],[2700,2500],[2890,3800],[5150,5000],[6371,5400]];
const PPROF=[[0,0],[12,.33],[35,1],[410,13.5],[660,23.8],[2890,136],[5150,330],[6371,364]];
const GPROF=[[0,9.82],[660,10.0],[2000,9.9],[2890,10.68],[5150,4.4],[6371,0]];
function prof(P,d){for(let i=1;i<P.length;i++)if(d<=P[i][0]){const[a,x]=P[i-1],[b,y]=P[i];return lerp(x,y,(d-a)/(b-a))}return P[P.length-1][1]}
const T=d=>prof(TPROF,d),P=d=>prof(PPROF,d),G=d=>prof(GPROF,d);
// rétegek: [kezdet km, név, kőzetszín, szemcseszín, keménység-szorzó (nagyobb = gyorsabb), ásványok]
const RETEG=[
  [0,'Felső kéreg','#5b4636','#8a6d52',1,[['kvarc',1],['földpát',1.2],['pirit',2]]],
  [15,'Alsó kéreg','#3f3a37','#6b625a',.9,[['gabbró',1.5],['magnetit',2.5]]],
  [35,'Felső köpeny','#3d4a2c','#7f9a4a',1.4,[['olivin',3],['piroxén',3.5],['gyémánt',12]]],
  [410,'Átmeneti zóna','#2c4a46','#5fa39a',1.5,[['wadsleyit',6],['ringwoodit',9]]],
  [660,'Alsó köpeny','#4a2f3d','#a35f80',1.7,[['bridgmanit',10],['ferroperiklász',12]]],
  [2700,'D″ réteg','#5a2a1c','#c4552e',1.6,[['posztperovszkit',22]]],
  [2890,'Külső mag','#7a3a0c','#ffb347',4,[['vas–nikkel',30]]],
  [5150,'Belső mag','#a8a29a','#fff4d6',2.2,[['vaskristály',60]]]];
const reteg=d=>{let r=RETEG[0];for(const x of RETEG)if(d>=x[0])r=x;return r};
// mérföldkövek: [mélység, napló-kulcs, cím, tény]
const KOVEK=[
  [1,'','Az első kilométer','A kéreg felső kilométerein a hőmérséklet kilométerenként nagyjából 25 °C-kal nő (geotermikus gradiens). A bányák legmélyebb tárnái 4 km körül járnak, ott már 60 °C fölötti a kőzet.'],
  [12.262,'me:kola','Túl a Kola-fúráson','Az ember legmélyebb fúrása a Kola-félszigeten 1989-ben 12 262 méternél állt meg: 180 °C-nál a kőzet már képlékenyen viselkedett, a fúrófej nem bírta. Te most mélyebben jársz, mint bárki valaha.'],
  [35,'me:moho','A Moho-határ','Andrija Mohorovičić horvát geofizikus 1909-ben vette észre, hogy a földrengéshullámok ezen a mélységen hirtelen felgyorsulnak: itt ér véget a kéreg, és kezdődik a köpeny. Az óceánok alatt ez csak 5–10 km.'],
  [410,'me:kopeny','Olivin → wadsleyit','A nyomás itt akkora (13–14 GPa), hogy az olivin kristályrácsa összeroppan, és sűrűbb ásvánnyá, wadsleyitté alakul. A szeizmikus hullámok erről a „lépcsőről” verődnek vissza.'],
  [520,'','Víz a kőben','A ringwoodit vizet tud megkötni a kristályrácsában. 2014-ben egy brazil gyémánt zárványában találtak víztartalmú ringwoodit-szemcsét: az átmeneti zóna akár több óceánnyi vizet is őrizhet.'],
  [660,'','A Föld leggyakoribb ásványa','Az alsó köpenyt főleg bridgmanit alkotja. Ez a Föld leggyakoribb ásványa, mégis csak 2014-ben kapott nevet, mert a felszínen nem marad stabil, csak meteoritokban találták meg.'],
  [2890,'me:mag','A Gutenberg-határ','Itt ér véget a szilárd köpeny, és kezdődik a folyékony vas–nikkel külső mag. Benne az áramlások hajtják a geodinamót: ez kelti a Föld mágneses terét, ami megvéd a napszéltől. A nehézségi gyorsulás itt a legnagyobb, kb. 10,7 m/s².'],
  [5150,'me:belso','A Lehmann-határ','Inge Lehmann dán szeizmológus 1936-ban mutatta ki, hogy a mag közepe szilárd. Bár 5000 °C fölött van – nagyjából a Nap felszínének hőmérséklete –, a 330 GPa nyomás szilárd vaskristállyá préseli.'],
  [6371,'me:kozep','A Föld középpontja','Itt a nehézségi erő nulla: minden irányban ugyanannyi tömeg húz. Nincs lent és fent. És a közepén valami, ami nem lehetne itt: fény, ami kifelé áramlik.']];

// ---- mentés ----
const KEY='melyseg:v1';
const UPG=[
  ['fur','Fúrófej','gyorsabban halad (km/s)',l=>.12*Math.pow(1.75,l),v=>hu(v,v<1?2:1)+' km/s',30],
  ['hut','Hűtés','ekkora külső hőt bír (°C)',l=>80+120*Math.pow(1.45,l),v=>hu(Math.round(v))+' °C',40],
  ['hej','Nyomásálló héj','eddig a nyomásig mehet (GPa)',l=>.4*Math.pow(1.9,l),v=>hu(v,v<10?1:0)+' GPa',40],
  ['akk','Akkumulátor','ennyi ideig fúr (másodperc)',l=>45+12*l,v=>Math.round(v)+' mp',25],
  ['mag','Mágnes','messzebbről gyűjti a mintákat',l=>.05+.022*l,v=>hu(v*100)+' %',20]];
const cost=(u,l)=>Math.round(u[5]*Math.pow(1.85,l));
function fresh(){return{kr:0,up:{fur:0,hut:0,hej:0,akk:0,mag:0},best:0,dives:0,total:0,kov:{},nev:''}}
let S=fresh();
try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.up)S={...fresh(),...o,up:{...fresh().up,...o.up},kov:o.kov||{}}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const val=id=>UPG.find(u=>u[0]===id)[3](S.up[id]);

// ---- közös napló a többi játékkal (Eseményhorizont, Kísérleti Lőtér, Raktár 3D, Égtorony, Mézország, Jeltörő…) ----
const UNIV_KEY='univerzum-naplo';
const univ={get(){try{return JSON.parse(localStorage.getItem(UNIV_KEY))||{}}catch(_){return {}}},has(k){return !!this.get()[k]},
  set(k){const n=this.get();if(n[k])return false;n[k]=Date.now();try{localStorage.setItem(UNIV_KEY,JSON.stringify(n))}catch(_){}return true}};
univ.set('me:jart');
function univBeagyazva(){try{return window.parent!==window&&window.parent.location.origin===location.origin}catch(_){return false}}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href*="Esemenyhorizont"]');if(a&&univBeagyazva()){e.preventDefault();window.parent.postMessage({type:'univ-vissza',from:'melyseg'},location.origin)}});
const VILAGOK=[
  ['eh:jart','Eseményhorizont','../Esemenyhorizont/?from=melyseg','Egy hajó egy fekete lyuk körül. Ami ott elnyelődik, annak valahol ki kell jönnie.'],
  ['lo:jart','Kísérleti Lőtér','../Kiserleti_robbantas/','Rakéták 1957-ből: ők felfelé akarnak kijutni, te lefelé.'],
  ['r3:jart','Raktár 3D','../raktar-3d/','Egy raktár, ahol a legmélyebb pont a pohármosó lefolyója.'],
  ['eg:jart','Égtorony','../Egtorony/','Egy torony a felhők fölé. A Mélység a tükörképe: ott felfelé, itt lefelé nő az ellenállás.'],
  ['mo:jart','Mézország','../Mezorszag/','Kaptárak egy akácos szélén. A gyökerek a kéreg felső métereiig érnek – onnan te megyed tovább.'],
  ['jt:jart','Jeltörő','../Jel-toro/','Egy lehallgatóállomás, ahol furcsa adásokat fejtenek meg. Az egyik a Föld belsejéből jön.']];
function ajandekok(){const n=univ.get(),A=[['eh:horizont',400,'Egy eseményhorizont mögül hő szivárog vissza: +400 kr a kutatásra.'],['eg:sziv',300,'Egy torony Szíve megrepedt, a földrengés új repedéseket nyitott: +300 kr.'],
  ['mo:csillag',200,'Csillagméhek szálltak el a fúrótorony fölött: a méhészek támogatják az expedíciót, +200 kr.'],['lo:moon',300,'Valaki a Holdra jutott; a Föld közepe még mindig érintetlen. Az Akadémia +300 kr-t ad.'],
  ['r3:feketelyuk',150,'Egy raktár pohármosójában apró fekete lyuk nyílt. A szeizmográfok jelezték: +150 kr.'],['eh:egg:melyseg',300,'Egy fekete lyuk mögötti buborékban rátaláltak a fúrótornyodra: +300 kr.']];
  let uz='';for(const[k,kr,sz]of A)if(n[k]&&univ.set('me:ajandek:'+k)){S.kr+=kr;uz+='<p class="kicsi">'+sz+'</p>'}if(uz)save();return uz}

// ---- heti verseny (közös modul, mint az Égtoronyban és a Mézországban) ----
// ---- Multiverzum-bajnokság: heti rangsor más játékosokkal ----
// Egy nyilvános MQTT üzenetközvetítőn (HiveMQ, mint a Raktár 3D-ben és a Lőtér Űrversenyében) megy át a játékosok
// neve és heti eredménye; saját szerver nincs. Témák (VS_CS/...):
//   <játék>/<hét>/<azonosító>  – megőrzött heti eredmény: {id, nev, v:{...}, ts}
//   jelen/<játék>/<azonosító>  – megőrzött jelenlét (a kapcsolat megszakadásakor a szerver törli)
//   <játék>/e                  – élő hírek: {id, nev, t}
// Hétfőn új hét, új rangsor; az előző hét győztese (ha legalább ketten versenyeztek) egyszeri jutalmat kap.
const VS_BROKER='wss://broker.hivemq.com:8884/mqtt',VS_CS='multiverzum-bajnoksag-r4w8';
function vsHet(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);
  const e=t.getUTCFullYear();return e+'-W'+String(Math.ceil(((t-Date.UTC(e,0,1))/864e5+1)/7)).padStart(2,'0')}
function inditVerseny({jatek,ertek,rendez,jutalom,valtozott}){
  const id=(()=>{let i;try{i=localStorage.getItem('multiverzum-id')}catch(e){}if(!i){i=Math.random().toString(36).slice(2,10);try{localStorage.setItem('multiverzum-id',i)}catch(e){}}return i})();
  const V={be:false,het:vsHet(),lap:{},elozo:{},jelen:{},hirek:[],k:null,kuld:'',uz:'Kapcsolódás…',id};
  V.elozoHet=vsHet(new Date(Date.now()-7*864e5));
  V.nev=()=>{try{return localStorage.getItem('multiverzum-nev')||''}catch(e){return ''}};
  V.nevBe=n=>{n=String(n||'').trim().slice(0,24);try{localStorage.setItem('multiverzum-nev',n)}catch(e){}V.kuld='';V.kozol();jelenKuld()};
  const tiszta=o=>o&&typeof o.id==='string'&&o.v&&typeof o.v==='object'?{id:o.id,nev:String(o.nev||'?').slice(0,24),v:o.v,ts:+o.ts||0}:null;
  V.rangsor=(L=V.lap,sajat=true)=>{const l={...L};if(sajat){const v=ertek();if(v)l[id]={id,nev:V.nev()||'Névtelen',v,ts:Date.now()}}
    return Object.values(l).filter(Boolean).map(x=>({...x,en:x.id===id})).filter(x=>x.en||Object.values(x.v).some(v=>+v>0)).sort((a,b)=>rendez(a.v,b.v))};
  const jt=()=>VS_CS+'/jelen/'+jatek+'/'+id;
  function jelenKuld(){if(V.be)V.k.publish(jt(),JSON.stringify({nev:V.nev()||'Névtelen'}),{qos:0,retain:true})}
  V.kozol=()=>{if(!V.be||!V.nev())return;const v=ertek();if(!v)return;const s=JSON.stringify(v);if(s===V.kuld)return;V.kuld=s;
    V.k.publish(VS_CS+'/'+jatek+'/'+V.het+'/'+id,JSON.stringify({id,nev:V.nev(),v,ts:Date.now()}),{qos:0,retain:true})};
  V.hir=t=>{if(V.be&&V.nev())V.k.publish(VS_CS+'/'+jatek+'/e',JSON.stringify({id,nev:V.nev(),t:String(t).slice(0,140)}),{qos:0})};
  V.fent=()=>Object.keys(V.jelen).length;
  // az előző hét győztese: egyszer, ha mi voltunk az elsők (és nem egyedül)
  let bajnokNezve=false;
  function bajnokCsekk(){if(bajnokNezve)return;const R=V.rangsor(V.elozo,false);if(R.length<2||R[0].id!==id)return;bajnokNezve=true;
    let n={};try{n=JSON.parse(localStorage.getItem('univerzum-naplo'))||{}}catch(e){}const k=jatek+':bajnok:'+V.elozoHet;if(n[k])return;
    n[k]=Date.now();try{localStorage.setItem('univerzum-naplo',JSON.stringify(n))}catch(e){}jutalom(V.elozoHet,R.length)}
  (async()=>{let mqtt;try{const mod=await import('./vendor/mqtt/mqtt.esm.js');mqtt=mod.default?.connect?mod.default:mod.default?.default??mod}catch(e){V.uz='A versenyhez nem sikerült betölteni a hálózati könyvtárat.';valtozott();return}
    V.k=mqtt.connect(VS_BROKER,{clientId:jatek+'_'+id+'_'+Math.random().toString(36).slice(2,6),clean:true,keepalive:30,reconnectPeriod:5000,connectTimeout:10000,will:{topic:jt(),payload:'',qos:0,retain:true}});
    V.k.on('connect',()=>{V.be=true;V.uz='';V.het=vsHet();V.k.subscribe(VS_CS+'/'+jatek+'/'+V.het+'/+');V.k.subscribe(VS_CS+'/'+jatek+'/'+V.elozoHet+'/+');
      V.k.subscribe(VS_CS+'/jelen/'+jatek+'/+');V.k.subscribe(VS_CS+'/'+jatek+'/e');jelenKuld();V.kuld='';V.kozol();valtozott();setTimeout(bajnokCsekk,4000)});
    V.k.on('close',()=>{if(V.be){V.be=false;V.uz='A kapcsolat megszakadt, újrapróbálom…';valtozott()}});
    V.k.on('error',e=>console.warn('[verseny]',e?.message||e));
    V.k.on('message',(tema,adat)=>{const r=tema.slice(VS_CS.length+1).split('/');let o=null;try{const s=adat.toString();o=s?JSON.parse(s):null}catch(e){return}

  if(mod!=='bazis')return;
  const aj=ajandekok();
  let h='<div><h1>Mélység</h1><p class="dim">Fúrókapszulával a Föld középpontja felé. 6371 km kőzet, olvadt vas és nyomás – és ami a közepén vár.</p></div>';
  if(osszegzes){const o=osszegzes;
    if(o.kozep)h+='<section class="card" style="border-color:#fff;background:linear-gradient(180deg,#fff3,#17120e)"><h2>Fehér lyuk</h2><p>A Föld középpontjában nincs lent és fent. És van ott valami, aminek nem lehetne: fény, ami nem elnyelődik, hanem kiárad. Mintha egy fekete lyuk másik vége volna.</p><p class="dim">A kapszulát a fény visszalökte a felszínre. A minták megmaradtak.</p><a class="kapu" href="../Esemenyhorizont/?from=melyseg">Kövesd a fényt: Eseményhorizont ↗</a></section>';
    h+='<section class="card"><div class="row"><h2>A merülés eredménye</h2>'+(o.rekord?'<span class="chip">ÚJ REKORD</span>':'')+'</div><div class="osszeg">Mélység: <b>'+km(o.max)+'</b><br>Minták: <b>+'+hu(o.kr)+' kr</b>'+(o.veszt?' <span style="color:var(--bad)">(−'+hu(o.veszt)+' kr a vészkilövésnél)</span>':'')+'</div>'
      +(Object.keys(o.minta).length?'<p class="dim kicsi">'+Object.entries(o.minta).map(([k,n])=>n+'× '+k).join(' · ')+'</p>':'')+(o.kovek.length?'<p class="kicsi">Elértél: '+o.kovek.join(', ')+'.</p>':'')+'</section>';}
  if(aj)h+='<section class="card" style="border-color:#9b7bff">'+aj+'</section>';
  h+='<button class="go" id="go">⬇ MERÜLÉS</button>';
  h+='<div class="tabs">'+[['fejl','Fejlesztés'],['naplo','Napló'],['verseny','Verseny'],['vilag','Más világok']].map(([k,n])=>'<button data-f="'+k+'" aria-pressed="'+(lapFul===k)+'">'+n+'</button>').join('')+'</div>';
  if(lapFul==='fejl'){
    h+='<section class="card"><div class="row"><h2>Kutatási keret</h2><span class="chip">'+hu(S.kr)+' kr</span></div><img id="fold" src="'+foldKep()+'" alt="A Föld keresztmetszete a legmélyebb pontoddal">';
    h+=UPG.map(u=>{const l=S.up[u[0]],c=cost(u,l);return '<div class="up"><h3>'+u[1]+' · '+(l+1)+'. szint</h3><button data-u="'+u[0]+'" '+(S.kr<c?'disabled':'')+'>'+hu(c)+' kr</button><span class="dim kicsi">'+u[2]+': '+u[4](u[3](l))+' → <b style="color:var(--ink)">'+u[4](u[3](l+1))+'</b></span></div>'}).join('');
    const kov=KOVEK.find(k=>k[0]>S.best);
    h+='<p class="dim kicsi">'+(kov?'Következő mérföldkő: <b style="color:var(--ink)">'+kov[2]+'</b> ('+km(kov[0])+', '+hu(Math.round(T(kov[0])))+' °C, '+hu(P(kov[0]),1)+' GPa).':'Elérted a Föld középpontját. Mélyebbre nincs hová – csak tovább.')+'</p></section>';}
  else if(lapFul==='naplo'){
    h+='<section class="card"><h2>Napló</h2><div class="log">'+KOVEK.filter(k=>S.kov[k[2]]).map(k=>'<div><b>'+k[2]+'</b> · '+km(k[0])+'<br><span class="dim kicsi">'+k[3]+'</span></div>').join('')+'</div>'+(Object.keys(S.kov).length?'':'<p class="dim">Még üres. Minden új mélységről ide kerül, mit tud róla a tudomány.</p>')+'<p class="dim kicsi">'+S.dives+' merülés · összesen '+hu(S.total)+' kr minta. A hőmérséklet, a nyomás és a nehézségi gyorsulás a PREM földmodell közelítése.</p></section>';}
  else if(lapFul==='verseny'){const R=VS.rangsor(),hely=R.findIndex(x=>x.en)+1;
    h+='<section class="card" style="border-color:var(--gold)"><div class="row"><h2>Heti mélységverseny</h2><span class="chip">'+(VS.be?(VS.fent()+1)+' fent':'nincs kapcsolat')+'</span></div><p class="dim kicsi">Ki jut a héten egyetlen merüléssel a legmélyebbre? Hétfőn új verseny indul; a múlt heti győztes +600 kr-t kap.'+(VS.uz?' '+VS.uz:'')+'</p>';
    if(!VS.nev())h+='<div class="row" style="margin:8px 0"><input id="vsNev" maxlength="24" placeholder="A fúrócsapatod neve" style="flex:1"><button class="up" style="border:1px solid var(--lava);border-radius:10px;background:none;color:var(--ink);padding:9px 12px;font-weight:800" id="vsOk">Beszállok</button></div>';
    h+=R.length?'<table class="vtab"><tr><th>#</th><th>Csapat</th><th class="sz">Mélység</th></tr>'+R.slice(0,10).map((x,i)=>'<tr class="'+(x.en?'en':'')+'"><td>'+(i+1)+'</td><td>'+esc(x.nev)+(x.en?' (te)':'')+(VS.jelen[x.id]&&!x.en?'<span class="fent">fent</span>':'')+'</td><td class="sz">'+km(+x.v.d||0)+'</td></tr>').join('')+'</table>':'<p class="dim">Ezen a héten még senki sem merült. Az első merülésed után itt leszel.</p>';
    if(hely&&R.length>1)h+='<p class="kicsi">Most a <b>'+hely+'.</b> vagy '+R.length+' csapat közül.</p>';
    if(VS.hirek.length)h+='<div class="log kicsi">'+VS.hirek.slice(0,4).map(x=>'<div>'+esc(x.nev)+' '+esc(x.t)+'</div>').join('')+'</div>';
    h+='<p class="dim kicsi">A csapatnév és a heti mélység egy nyilvános üzenetközvetítőn (HiveMQ) megy át a többi játékoshoz; más adat nem.</p></section>';}
  else{const n=univ.get(),jart=VILAGOK.filter(v=>n[v[0]]);
    h+='<section class="card" style="border-color:#9b7bff"><h2>Más világok</h2>'+(n['me:kozep']?'<p class="kicsi">A Föld közepén fény árad kifelé, mintha egy fekete lyuk másik vége volna.</p>':'<p class="dim kicsi">Akik a Föld középpontjáig jutnak, azok furcsa fényt látnak. Talán egy másik világ kapuja.</p>')
      +jart.map(v=>'<p class="kicsi"><b>'+v[1]+'.</b> <span class="dim">'+v[3]+'</span></p>').join('')
      +VILAGOK.filter(v=>n[v[0]]||(v[0]==='eh:jart'&&n['me:kozep'])).map(v=>'<a class="kapu" href="'+v[2]+'">'+v[1]+' ↗</a>').join('')+'</section>';}
  $('wrap').innerHTML=h;
  $('go').onclick=indul;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{lapFul=b.dataset.f;osszegzes=null;render()});
  document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const u=UPG.find(x=>x[0]===b.dataset.u),c=cost(u,S.up[u[0]]);if(S.kr<c)return;S.kr-=c;S.up[u[0]]++;save();hangInit();csip(990,.15);render()});
  const ok=$('vsOk');if(ok)ok.onclick=()=>{const v=$('vsNev').value.trim();if(v){VS.nevBe(v);render()}};
}

// ---- ciklus ----
let last=performance.now();
function ciklus(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(M)lep(dt);rajz();
  if(uzT>0){uzT-=dt;if(uzT<=0)$('uz').style.opacity=0}requestAnimationFrame(ciklus)}
render();requestAnimationFrame(ciklus);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(AC)AC.suspend()}else if(AC&&M)AC.resume()});
})();
</script>
</body>
</html>
